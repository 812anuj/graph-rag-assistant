[project]
name = "graph-rag-assistant"
version = "0.1.0"
description = "Graph RAG assistant using Neo4j and vector search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "groq>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "neo4j>=6.4.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "setuptools>=84.2.1",
]
